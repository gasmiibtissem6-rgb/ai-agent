name: ideal_contract
description: IDEAL - Secure Deal Management Platform

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  
  # Routing
  go_router: ^13.0.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # UI & Icons
  cupertino_icons: ^1.0.0
  flutter_svg: ^2.0.0
  
  # Formatting & Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  
  # Image handling
  image_picker: ^1.0.0
  
  # Bottom sheet
  modal_bottom_sheet: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
