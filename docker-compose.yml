services:
  postgres:
    image: postgres:16-alpine
    container_name: ideal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ideal
      POSTGRES_PASSWORD: ideal_dev_password
      POSTGRES_DB: ideal_dev
    ports:
      - "5434:5432"
    volumes:
      - ideal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideal -d ideal_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ideal_postgres_data:
